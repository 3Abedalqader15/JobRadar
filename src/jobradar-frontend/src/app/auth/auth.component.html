<div class="auth-container">
  <h2>{{ isLoginMode ? 'Login' : 'Sign Up' }}</h2>
  
  <div *ngIf="error" class="error">{{ error }}</div>
  
  <form [formGroup]="authForm" (ngSubmit)="onSubmit()">
    
    <div class="form-group" *ngIf="!isLoginMode">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" class="form-control" formControlName="fullName" placeholder="John Doe">
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" class="form-control" formControlName="email" placeholder="email@example.com">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" class="form-control" formControlName="password" placeholder="Password">
    </div>

    <button type="submit" class="btn" [disabled]="authForm.invalid || loading">
      {{ loading ? 'Processing...' : (isLoginMode ? 'Login' : 'Sign Up') }}
    </button>
  </form>

  <div class="toggle-link" (click)="toggleMode()">
    {{ isLoginMode ? 'Don\'t have an account? Sign up.' : 'Already have an account? Login.' }}
  </div>
</div>
